name: mypy

on:
  push:
    branches: [main, "version-*"]
  pull_request:
    branches: [main, "version-*"]
  release:
    types:
      - published
  schedule:
    # Run nightly to check that tests are working with latest dependencies
    - cron: "0 0 * * *"

permissions:
  contents: read
  pull-requests: write

jobs:
  mypy:
    strategy:
      matrix:
        python-version: ["3.11", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --extra dev --no-install-project --python ${{ matrix.python-version }}

      - name: List dependencies
        run: uv pip freeze

      - name: Run mypy
        run: uv run --no-sync mypy .
