name: Build Docs

on:
  push:
    branches: [main, "version-*"]
  pull_request:
    branches: [main, "version-*"]

permissions:
  contents: read
  pull-requests: write

jobs:
  build_docs:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Linux dependencies
        run: |
          sudo apt-get install libeigen3-dev libfmt-dev

      - name: Install xtgeo
        run: uv sync --locked --extra docs --python 3.11

      - name: Build docs
        run: uv run --no-sync sphinx-build -W -b html docs build/docs/html