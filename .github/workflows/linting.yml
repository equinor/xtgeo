name: Linting

on:
  push:
    branches: [main, "version-*"]
  pull_request:
    branches: [main, "version-*"]
  release:
    types:
      - published
  schedule:
    # Run nightly to check that tests are working with latest dependencies
    - cron: "0 0 * * *"

permissions:
  contents: read
  pull-requests: write

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install lint tools
        run: uv sync --locked --only-dev --python 3.12

      - name: List dependencies
        run: uv pip freeze

      - name: Ruff check
        if: ${{ always() }}
        run: uv run --no-sync ruff check .

      - name: Ruff format
        if: ${{ always() }}
        run: uv run --no-sync ruff format . --check

      - name: cmake-format
        if: ${{ always() }}
        run: |
          shopt -s globstar
          uv run --no-sync cmake-format --check **/CMakeLists.txt

      - name: clang-format
        if: ${{ always() }}
        run: |
          shopt -s globstar
          uv run --no-sync clang-format **/*.{c,h,cpp,hpp} -Werror -n --verbose
