name: Setup xtgeo
description: Set up the xtgeo test environment

inputs:
  python-version:
    required: true
    type: string
  os:
    required: true
    default: ubuntu-latest
    type: string

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
    
    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}
              
    - name: Get runner image version
      if: ${{ inputs.os == 'windows-latest' }}
      id: image
      shell: bash
      run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

    - name: Cache vcpkg packages
      if: ${{ inputs.os == 'windows-latest' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~\AppData\Local\vcpkg\archives
        # Same key as in publish.yml, so the test and wheel jobs share the cache.
        key: vcpkg-x64-windows-${{ steps.image.outputs.version }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-x64-windows-

    - name: Install Windows dependencies
      if: ${{ inputs.os == 'windows-latest' }}
      shell: bash
      run: |
        vcpkg install --triplet x64-windows

    - name: Install macOS dependencies
      if: ${{ inputs.os == 'macos-latest' || inputs.os == 'macos-13' }}
      # HDF5 needed for h5py+Python 3.10+
      shell: bash
      run: |
        # The default eigen formula is Eigen 5. eigen@3 is keg-only, so set its prefix.
        brew install hdf5 eigen@3 fmt
        echo "HDF5_DIR=/opt/homebrew" >> $GITHUB_ENV
        echo "CMAKE_PREFIX_PATH=$(brew --prefix eigen@3)" >> $GITHUB_ENV

    - name: Install Linux dependencies
      if: ${{ inputs.os == 'ubuntu-latest' }}
      shell: bash
      run: |
        sudo apt-get install libeigen3-dev libfmt-dev

    - name: Build and install xtgeo
      shell: bash
      # Later steps must use `uv run --no-sync`, or uv builds xtgeo a second time.
      run: uv sync --locked --extra dev --python ${{ inputs.python-version }} -v
