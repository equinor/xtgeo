    { name = "autoclasstoc", marker = "extra == 'docs'" },
    { name = "clang-format", marker = "extra == 'dev'" },
    { name = "cmake-format", marker = "extra == 'dev'" },
    { name = "coverage", marker = "extra == 'dev'", specifier = ">=4.1" },
    { name = "deprecation" },
    { name = "gstools" },
    { name = "h5py", specifier = ">=3" },
    { name = "hdf5plugin", specifier = ">=2.3" },
    { name = "hypothesis", marker = "extra == 'dev'" },
    { name = "joblib" },
    { name = "matplotlib", specifier = ">=3.3" },
    { name = "mypy", marker = "extra == 'dev'" },
    { name = "myst-parser", marker = "extra == 'docs'" },
    { name = "numpy" },
    { name = "pandas", specifier = ">=1.1" },
    { name = "pandas-stubs", marker = "extra == 'dev'" },
    { name = "psutil", marker = "extra == 'dev'" },
    { name = "pyarrow" },
    { name = "pydocstyle", marker = "extra == 'dev'" },
    { name = "pydocstyle", marker = "extra == 'docs'" },
    { name = "pytest", marker = "extra == 'dev'" },
    { name = "pytest-benchmark", marker = "extra == 'dev'" },
    { name = "pytest-codspeed", marker = "extra == 'dev'" },
    { name = "pytest-cov", marker = "extra == 'dev'" },
    { name = "pytest-mock", marker = "extra == 'dev'" },
    { name = "pytest-runner", marker = "extra == 'dev'" },
    { name = "pytest-snapshot", marker = "extra == 'dev'" },
    { name = "pytest-xdist", marker = "extra == 'dev'" },
    { name = "resfo", specifier = ">=5" },
    { name = "roffio", specifier = ">=0.0.2" },
    { name = "ruff", marker = "extra == 'dev'" },
    { name = "scipy", specifier = ">=1.5" },
    { name = "segyio", specifier = ">1.8.0" },
    { name = "shapely", specifier = ">=1.6.2" },
    { name = "sphinx", marker = "extra == 'docs'" },
    { name = "sphinx-autodoc-typehints", marker = "extra == 'docs'" },
    { name = "sphinx-rtd-theme", marker = "extra == 'docs'" },
    { name = "sphinx-tabs", marker = "extra == 'docs'", specifier = "<3.4.5" },
    { name = "sphinx-toolbox", marker = "extra == 'docs'", specifier = ">=3.5.0" },
    { name = "typing-extensions" },
    { name = "xtgeoviz" },
]
provides-extras = ["dev", "docs"]

